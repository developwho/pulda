AWSTemplateFormatVersion: '2010-09-09'
Description: Pulda same-origin web and API on ECS Fargate. No patient data storage.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two ALB subnets in different Availability Zones.
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two ECS subnets with NAT egress to OpenAI, ECR, Secrets Manager and DynamoDB.
  CertificateArn:
    Type: String
    Description: ACM certificate in this region for the app domain.
  AppOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
    Description: Exact origin without trailing slash, e.g. https://pulda.example.com
  ImageUri:
    Type: String
    Description: Immutable ECR image URI with sha256 digest.
    AllowedPattern: '.+@sha256:[a-f0-9]{64}'
  SecretArn:
    Type: String
    Description: Secrets Manager JSON secret with OPENAI_API_KEY and SESSION_SECRET (32+ random characters).
  GenerationModel:
    Type: String
    Default: gpt-6-luna
  TranscriptionModel:
    Type: String
    Default: gpt-live-transcribe
  OperatorName:
    Type: String
    MinLength: 1
  PrivacyEmail:
    Type: String
    AllowedPattern: '[^\s@]+@[^\s@]+\.[^\s@]+'
Resources:
  Limits:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: pk, AttributeType: S }]
      KeySchema: [{ AttributeName: pk, KeyType: HASH }]
      TimeToLiveSpecification: { AttributeName: expires, Enabled: true }
      SSESpecification: { SSEEnabled: true }
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 30 }
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and redirect only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application accepts only the ALB
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3001
          ToPort: 3001
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '120' }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3001
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /readyz
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: '30' }]
  HTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  Redirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          [
            {
              Effect: Allow,
              Principal: { Service: ecs-tasks.amazonaws.com },
              Action: 'sts:AssumeRole',
            },
          ]
      ManagedPolicyArns:
        [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: ReadAppSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              [{ Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref SecretArn }]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          [
            {
              Effect: Allow,
              Principal: { Service: ecs-tasks.amazonaws.com },
              Action: 'sts:AssumeRole',
            },
          ]
      Policies:
        - PolicyName: SharedUsageLimits
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              [{ Effect: Allow, Action: 'dynamodb:UpdateItem', Resource: !GetAtt Limits.Arn }]
  Cluster:
    Type: AWS::ECS::Cluster
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: pulda
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          PortMappings: [{ ContainerPort: 3001, Protocol: tcp }]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: APP_ORIGIN, Value: !Ref AppOrigin }
            - { Name: RATE_LIMIT_TABLE, Value: !Ref Limits }
            - { Name: AWS_REGION, Value: !Ref 'AWS::Region' }
            - { Name: PULDA_MODEL, Value: !Ref GenerationModel }
            - { Name: PULDA_TRANSCRIBE_MODEL, Value: !Ref TranscriptionModel }
            - { Name: MAX_DAILY_AI_CALLS, Value: '1000' }
            - { Name: MAX_DAILY_VOICE_SESSIONS, Value: '200' }
            - { Name: OPERATOR_NAME, Value: !Ref OperatorName }
            - { Name: PRIVACY_EMAIL, Value: !Ref PrivacyEmail }
          Secrets:
            - { Name: OPENAI_API_KEY, ValueFrom: !Sub '${SecretArn}:OPENAI_API_KEY::' }
            - { Name: SESSION_SECRET, ValueFrom: !Sub '${SecretArn}:SESSION_SECRET::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: app
  Service:
    Type: AWS::ECS::Service
    DependsOn: HTTPS
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: 2
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnets
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        [{ ContainerName: pulda, ContainerPort: 3001, TargetGroupArn: !Ref TargetGroup }]
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        { CloudWatchMetricsEnabled: true, SampledRequestsEnabled: false, MetricName: PuldaWAF }
      Rules:
        - Name: IPRequestLimit
          Priority: 0
          Statement:
            RateBasedStatement: { Limit: 1000, AggregateKeyType: IP }
          Action: { Block: {} }
          VisibilityConfig:
            { CloudWatchMetricsEnabled: true, SampledRequestsEnabled: false, MetricName: PuldaRate }
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties: { ResourceArn: !Ref LoadBalancer, WebACLArn: !GetAtt WebACL.Arn }
Outputs:
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref Logs
